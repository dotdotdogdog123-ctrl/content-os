name: Update daily topic radar
on:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/update-topics.yml'
  schedule:
    - cron: '15 1,9 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: content-os-topic-radar
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test classification rules
        run: |
          python -m compileall -q scripts tests
          python -m unittest discover -s tests -v
      - name: Fetch public RSS topics
        run: python scripts/update_topics.py
      - name: Fetch public finance videos
        run: python scripts/video_radar.py
      - name: Commit updated topics
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/topics.json data/videos.json
          if ! git diff --cached --quiet; then
            git commit -m "chore: refresh topic radar"
            git push
          fi
